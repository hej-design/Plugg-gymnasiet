<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Plugg</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600&display=swap">
<style>
:root{--navy:#182851;--gold:#b4975a;--brown:#362b25;--taupe:#7c675c;--paper:#f7f4f2;--white:#fffdfb;--line:#d6cfcc;color-scheme:light}
body{margin:0;background:var(--paper);color:var(--brown);font-family:"EB Garamond",Garamond,Georgia,serif;font-size:19px;line-height:1.55}
.wrap{max-width:640px;margin:0 auto;padding:2.5rem 16px 4rem}
h1{font-weight:500;font-size:2.2rem;color:var(--navy);margin:0 0 1.2rem}
a.card{display:block;background:var(--white);border:1px solid var(--line);border-radius:10px;padding:1rem 1.1rem;margin-bottom:.8rem;color:var(--navy);text-decoration:none}
a.card:hover,a.card:focus-visible{border-color:var(--gold);outline:none}
a.card strong{font-size:1.25rem;font-weight:600;display:block}
a.card span{color:var(--taupe);font-size:.95rem}
</style>
</head>
<body>
<div class="wrap">

</div>
</body>
</html>
